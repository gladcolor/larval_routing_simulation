<title>Sector Larval Density</title>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{ --bg:#0b0e13; --panel:rgba(22,27,34,0.93); --txt:#e6edf3; --mut:#9aa6b2; --accent:#58a6ff; --line:#30363d; }
  html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--txt);}
  #top{position:absolute;top:0;left:0;right:0;height:50px;display:flex;align-items:center;gap:18px;
    padding:0 16px;background:#161b22;border-bottom:1px solid var(--line);z-index:10;flex-wrap:wrap;}
  #top .ttl{font-size:14px;font-weight:600;}
  #top .ttl small{display:block;color:var(--mut);font-weight:400;font-size:11px;}
  #legend{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mut);}
  #grad{width:160px;height:12px;border-radius:6px;
    background:linear-gradient(90deg,#ffffcc,#ffeda0,#fed976,#feb24c,#fd8d3c,#fc4e2a,#e31a1c,#bd0026,#800026);}
  #valtog{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);cursor:pointer;}

  #grid{position:absolute;top:50px;left:0;right:0;bottom:0;display:grid;
    grid-template-columns:60px 1fr 1fr 1fr 1fr;grid-template-rows:26px 1fr 1fr 1fr;
    gap:1px;background:var(--line);}
  .hdr{background:#161b22;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:600;color:var(--txt);}
  .rowlab{background:#161b22;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:600;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.5px;}
  .cell{position:relative;background:#0b0e13;overflow:hidden;}
  .cmap{position:absolute;inset:0;}
  .leaflet-container{background:#0b0e13;}
  /* two-line bubble label: sector ID + average count */
  .slab{text-align:center;line-height:1.05;pointer-events:none;}
  .slab .sid{display:block;font-size:8px;font-weight:600;color:#fff;text-shadow:0 0 2px #000,0 0 2px #000;}
  .slab .sv{display:block;font-size:10px;font-weight:800;color:#101418;text-shadow:0 0 2px #fff,0 0 2px #fff;}
  #grid.hidevals .slab{display:none;}
  .leaflet-tooltip{font-size:12px;}
</style>
</head>

const CITIES=DATA.cities, CAMPS=DATA.campaigns, VMAX=DATA.vmax;
const $=id=>document.getElementById(id);
let maps=[];   // {map, city}

const YLORD=["#ffffcc","#ffeda0","#fed976","#feb24c","#fd8d3c","#fc4e2a","#e31a1c","#bd0026","#800026"];
const h2r=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
function ylord(t){ t=Math.max(0,Math.min(1,t)); const x=t*(YLORD.length-1), i=Math.floor(x);
  if(i>=YLORD.length-1) return YLORD[i]; const f=x-i, a=h2r(YLORD[i]), b=h2r(YLORD[i+1]);
  const c=a.map((v,k)=>Math.round(v+(b[k]-v)*f)); return `rgb(${c[0]},${c[1]},${c[2]})`; }

$("vmaxlab").textContent="≥"+Math.round(VMAX);
const base=()=>L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png?key=cb1_3hz0_1_6edd0f4ed3a54f45ad217495",
  {subdomains:"abcd",maxZoom:20,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, &copy; <a href="https://carto.com/attributions">CARTO</a>'});

function drawCell(city, camp, lg){
  DATA.sectors[city].forEach(s=>{
    const v=s.vals[camp], has=(v!==undefined && v!==null), n=s.ns[camp]||0;
    const col=has?ylord(v/VMAX):"#2b3038";
    const r=has? Math.max(6, 5+Math.sqrt(n)) : 4;            // size ~ habitat count
    const shape=L.circleMarker(s.centroid,{radius:r,color:"#10141a",weight:1,
      fillColor:col,fillOpacity:has?0.92:0.30});
    shape.bindTooltip(`<b>${s.sector}</b> &middot; ${city} &middot; ${camp}<br>`+
      `mean: <b>${has?v.toFixed(1):"—"}</b> larvae/habitat &middot; n=${n}`,{sticky:true});
    shape.addTo(lg);
    if(has) L.marker(s.centroid,{interactive:false,icon:L.divIcon({className:"slab",
      html:`<span class="sid">${s.sector}</span><span class="sv">${Math.round(v)}</span>`,
      iconSize:[34,22],iconAnchor:[17,11]})}).addTo(lg);
  });
}

// ---- build the 3 (city) x 4 (campaign) grid of maps ------------------------
const grid=$("grid");
function addCell(cls,txt){ const d=document.createElement("div"); d.className=cls; if(txt!==undefined) d.textContent=txt; grid.appendChild(d); return d; }
addCell("hdr","");                       // top-left corner
CAMPS.forEach(c=>addCell("hdr",c));      // campaign column headers
CITIES.forEach(city=>{
  addCell("rowlab",city);                // city row label
  CAMPS.forEach(camp=>{
    const cell=addCell("cell"); const md=document.createElement("div"); md.className="cmap"; cell.appendChild(md);
    const m=L.map(md,{layers:[base()],zoomControl:false,attributionControl:false,
      preferCanvas:true,dragging:true});
    m.fitBounds(DATA.bounds[city],{padding:[12,12]});
    drawCell(city,camp,L.layerGroup().addTo(m));
    maps.push({map:m,city:city});
  });
});

// maps are created before the grid has laid out -> fix sizes once visible
function refit(){ maps.forEach(o=>{ o.map.invalidateSize(); o.map.fitBounds(DATA.bounds[o.city],{padding:[12,12]}); }); }
requestAnimationFrame(()=>requestAnimationFrame(refit));

$("valchk").addEventListener("change",e=>$("grid").classList.toggle("hidevals",!e.target.checked));

// ---- dashboard messages: this view shows all campaigns, so it only resizes -
window.setMapSel=function(){};   // no-op (no single selection to apply)
window.addEventListener("message",e=>{ if((e.data||{}).type==="larvResize") refit(); });
</script>
