<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Larval Heatmap</title>

<style>
  :root{ --bg:#0e1117; --panel:rgba(22,27,34,0.93); --txt:#e6edf3; --mut:#9aa6b2; --accent:#58a6ff; --line:#30363d; }
  html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  #map{position:absolute;inset:0;background:#0b0e13;}
  .leaflet-container{background:#0b0e13;}
  .pnl{position:absolute;z-index:1000;background:var(--panel);color:var(--txt);
    border-radius:10px;box-shadow:0 2px 14px rgba(0,0,0,.5);backdrop-filter:blur(4px);}
  #title{top:12px;left:50%;transform:translateX(-50%);padding:8px 18px;font-size:15px;
    font-weight:600;text-align:center;}
  #title small{display:block;font-weight:400;color:var(--mut);font-size:11px;margin-top:2px;}
  #ctrl{top:12px;left:12px;padding:11px 13px;max-width:220px;}
  #ctrl b{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;}
  #ctrl .grp{margin-bottom:9px;}
  #ctrl label{display:inline-block;margin:4px 8px 0 0;cursor:pointer;font-size:13px;}
  #ctrl input[type=radio]{margin-right:4px;accent-color:var(--accent);vertical-align:-1px;}
  .seg{display:flex;margin-top:5px;border:1px solid var(--line);border-radius:7px;overflow:hidden;}
  .seg button{flex:1;background:#1b2027;color:var(--txt);border:none;padding:7px 4px;font-size:12px;cursor:pointer;}
  .seg button.on{background:var(--accent);color:#0b0e13;font-weight:600;}
  #radwrap{margin-top:10px;font-size:12px;color:var(--mut);}
  #radius{width:100%;accent-color:var(--accent);}
  #stats{top:12px;right:12px;padding:11px 13px;max-width:210px;font-size:12.5px;}
  #stats b{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;}
  #stats .v{color:var(--txt);font-weight:600;}
  #stats{max-width:230px;}
  #interp{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);
    font-size:12px;line-height:1.5;color:#cdd6df;}
  #interp b{color:var(--txt);}
  #legend{bottom:16px;left:12px;padding:10px 13px;font-size:11.5px;}
  #legend b{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;}
  #grad{height:12px;width:170px;border-radius:6px;margin:7px 0 3px;
    background:linear-gradient(90deg,#2c7bb6,#00ccbc,#a6d96a,#fdae61,#d7191c);}
  .gl{display:flex;justify-content:space-between;color:var(--mut);}
  .leaflet-bar a{background:#21262d;color:#e6edf3;border-bottom-color:#30363d;}
  .leaflet-bar a:hover{background:#30363d;}
  .note{color:var(--mut);font-size:10.5px;margin-top:9px;line-height:1.45;}
</style>
</head>

const sat=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {maxZoom:20,attribution:"Tiles &copy; Esri"});
const map=L.map("map",{layers:[dark]});
L.control.layers({"Dark":dark,"Satellite":sat},null,{position:"bottomright"}).addTo(map);

let city=CITIES[0], camp="All", mode="abundance", radius=26, heat=null;

function campsFor(ci){ return ["All", ...CAMPS.filter(c=>DATA[ci] && DATA[ci][c])]; }
function pointsFor(ci,ca){
  if(!DATA[ci]) return [];
  if(ca==="All"){ let a=[]; for(const c in DATA[ci]) a=a.concat(DATA[ci][c]); return a; }
  return DATA[ci][ca]||[];
}
function quantile(arr,q){ if(!arr.length) return 1;
  const s=[...arr].sort((a,b)=>a-b); const i=(s.length-1)*q, lo=Math.floor(i), hi=Math.ceil(i);
  return s[lo]+(s[hi]-s[lo])*(i-lo); }

function radios(el, vals, sel, cb){
  el.innerHTML="";
  vals.forEach(v=>{ const lab=document.createElement("label");
    lab.innerHTML=`<input type="radio" name="${el.id}" value="${v}" ${v===sel?"checked":""}>${v}`;
    lab.querySelector("input").addEventListener("change",()=>{ cb(v); notifyParent(); });
    el.appendChild(lab); });
}
function setCity(c){ city=c; const cs=campsFor(c); if(!cs.includes(camp)) camp="All";
  radios($("campR"), cs, camp, setCamp); draw(); }
function setCamp(c){ camp=c; draw(); }

$("seg").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
  mode=b.dataset.m; $("seg").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b)); draw(); }));
$("radius").addEventListener("input",e=>{ radius=+e.target.value; $("radVal").textContent=radius; draw(); });

function draw(){
  const pts=pointsFor(city,camp);
  let heatData, max;
  if(mode==="abundance"){
    heatData=pts.filter(p=>p[2]>0).map(p=>[p[0],p[1],Math.sqrt(p[2])]);
    max=Math.max(quantile(heatData.map(p=>p[2]),0.95), 0.5);
  } else {
    heatData=pts.map(p=>[p[0],p[1],1]); max=6;
  }
  if(heat) map.removeLayer(heat);
  heat=L.heatLayer(heatData,{radius:radius,blur:Math.round(radius*0.7),max:max,
    minOpacity:0.22,gradient:GRAD}).addTo(map);
  if(pts.length){ const la=pts.map(p=>p[0]), lo=pts.map(p=>p[1]);
    map.fitBounds([[Math.min(...la),Math.min(...lo)],[Math.max(...la),Math.max(...lo)]],{padding:[60,60]}); }
  updateStats(pts);
  $("legTitle").textContent = mode==="abundance" ? "Larval abundance" : "Site density";
}
function updateStats(pts){
  const n=pts.length, pos=pts.filter(p=>p[2]>0).length, tot=pts.reduce((s,p)=>s+p[2],0);
  const rate=n?Math.round(pos/n*100):0;
  $("sBody").innerHTML=`<span class="v">${city}</span> &middot; ${camp}<br>`+
    `sites: <span class="v">${n}</span> &middot; positive: <span class="v">${pos}</span> (${rate}%)<br>`+
    `total larvae: <span class="v">${tot.toLocaleString()}</span>`;
  const what = mode==="abundance"
    ? `bright red areas are where <b>An. stephensi larvae pile up</b> (most larvae per site within the radius); blue = sparse.`
    : `bright red areas are where <b>survey sites cluster densely</b> (more visits), regardless of larvae found.`;
  $("interp").innerHTML=`In <b>${city} &middot; ${camp}</b>, ${what} `+
    `This is a smoothed <b>visual density</b>, not a statistical test &mdash; for where clustering `+
    `is <b>statistically significant</b>, see the <b>&#128293; Spatial Hotspots</b> tab.`;
}

$("note").innerHTML="<b>Abundance</b> weights each site by &radic;(StepLarv); "+
  "<b>density</b> weights every site equally. Heat sums overlapping sites &mdash; "+
  "use the radius slider to tune smoothing.";

// ---- cross-tab selection sync via postMessage (file:// blocks direct access) -
function notifyParent(){ try{ if(window.parent!==window)
  window.parent.postMessage({type:"larvSel", city:city, camp:camp}, "*"); }catch(e){} }
window.setMapSel=function(ci, ca){           // apply a selection without re-notifying
  if(ci && DATA[ci]){ const rc=document.querySelector(`input[name=cityR][value="${ci}"]`);
    if(rc) rc.checked=true; city=ci; }                       // null city -> keep current
  const cs=campsFor(city);
  camp=(ca && cs.includes(ca)) ? ca : (cs.includes(camp)?camp:"All");
  radios($("campR"), cs, camp, setCamp); draw();
};
window.addEventListener("message",e=>{ const d=e.data||{};
  if(d.type==="larvSetSel") window.setMapSel(d.city, d.camp);
  else if(d.type==="larvResize") map.invalidateSize();
});

radios($("cityR"), CITIES, city, setCity);
setCity(city);
</script>
</body>
</html>
