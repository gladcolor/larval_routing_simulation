  <g id="text_30">
   <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="60.84" y="34.356563" transform="rotate(-0 60.84 34.356563)">Why use lift-ratio as the primary LSM ordering metric?</text>
  </g>
  <g id="text_31">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #596a7a" x="60.84" y="53.522625" transform="rotate(-0 60.84 53.522625)">Both metrics are valid, but their priorities differ | synthetic example | linear count gain and full-list NDCG</text>
  </g>
  <g id="text_32">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #596a7a" transform="translate(74.88 436.515375)">Use coverage curves for interpretable budget choices; use lift-ratio as a full-curve summary.</text>
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #596a7a" transform="translate(74.88 453.6)">NDCG is complementary, not invalid. It can be evaluated at any cutoff, including the full list.</text>
  </g>
  <g id="text_33">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #596a7a" x="74.88" y="491.4" transform="rotate(-0 74.88 491.4)">Synthetic counterexample, not evidence that one metric is universally superior. Neither metric accounts for travel time.</text>
  </g>
 </g>
 <defs>
  <clipPath id="pf77c8f3063">
   <rect x="74.88" y="120.96" width="366.856416" height="241.92"/>
  </clipPath>
